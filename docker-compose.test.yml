# 本地 E2E 测试环境(与生产完全隔离)。由 scripts/e2e-local.sh 拉起,勿用于生产。
# 端口特意错开:MySQL 13306(避免撞本机 3306)。
# name 必须显式给:仓库目录是中文名,compose 从目录推导项目名会得到空串而报错。
name: ${E2E_PROJECT:-oss-e2e}
services:
  mysql:
    image: mysql:8.0            # 铁律:用 8.0,mysql:8=8.4 移除了 default-authentication-plugin 会起不来
    container_name: ${E2E_PROJECT:-oss-e2e}-mysql
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@2026
      MYSQL_DATABASE: scm
      MYSQL_USER: scm
      MYSQL_PASSWORD: scm@2026
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot scm -N -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 90
