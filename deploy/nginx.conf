# 页面 + 接口转发。HTTPS 请在前面再加一层(云厂商负载均衡、Caddy、或另一个 Nginx 配证书)。

# 前面若还有一层 HTTPS 代理,沿用它传来的协议;没有就用本层的。后端靠它和 Host 判断"请求是不是同一个网站发的"。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
# 浏览器访问用的端口(地址栏里 :8080 这种):后端收到 X-Forwarded-Proto 后若不知道端口,会按 http=80 处理,
# 和浏览器的来源对不上又判成跨站。前面代理传了 X-Forwarded-Port 就用它,没有就从 Host 里取,都没有则不传(按协议默认)。
map $http_host $host_port {
    ~:(\d+)$ $1;
    default   "";
}
map $http_x_forwarded_port $fwd_port {
    default $http_x_forwarded_port;
    ""      $host_port;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 25m;   # 单个附件上限 20MB,留点余量

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头(location 里一旦再写 add_header,这里的就不继承,所以下面每个 location 都重复一遍)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        # 用 $http_host(带端口)而不是 $host(不带端口):端口丢了,后端会把浏览器的同站请求误判为跨站而拒绝(403)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Port $fwd_port;
        proxy_read_timeout 600s;    # 整库备份、大报表导出可能要几分钟
    }

    # 带哈希的静态文件:放心长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    # 入口页不缓存:换版后刷新就能拿到新版
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }
}
